; Main supervisord configuration. The whole desktop computer runs as the unprivileged user witden
; (the Docker Manager creates it with that user and refuses root), so supervisord keeps its state in /tmp.
[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=1MB
logfile_backups=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1280x800x24 -nolisten tcp
priority=10
autorestart=true
startretries=20

[program:fluxbox]
command=/bin/sh /home/witden/.fluxbox/startup
environment=DISPLAY=":1",HOME="/home/witden"
priority=20
autorestart=true
startretries=20

[program:vnc-control]
command=/usr/bin/x11vnc -display :1 -forever -shared -localhost -rfbport 5900 -nopw -quiet
priority=30
autorestart=true
startretries=20

[program:vnc-view]
command=/usr/bin/x11vnc -display :1 -forever -shared -viewonly -localhost -rfbport 5901 -nopw -quiet
priority=30
autorestart=true
startretries=20

; The Computer Runner: executes the platform's operations on this desktop (never as root).
[program:runner]
command=/usr/local/bin/node /opt/witden/runner/witden-runner.mjs
directory=/home/witden
environment=DISPLAY=":1",HOME="/home/witden",USER="witden",LOGNAME="witden",SHELL="/bin/bash"
priority=40
autorestart=true
startsecs=2
startretries=1000
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
