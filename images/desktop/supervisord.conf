; Main supervisord configuration. The whole desktop computer runs as the unprivileged user witden
; (the Docker Manager creates it with that user and refuses root), so supervisord keeps its state in /tmp.
; The Computer Runner is not here: witden-init starts it, and starts supervisord without the runner token.
[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=1MB
logfile_backups=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1280x800x24 -nolisten tcp
priority=10
autorestart=true
startretries=20

[program:fluxbox]
command=/bin/sh /home/witden/.fluxbox/startup
environment=DISPLAY=":1",HOME="/home/witden"
priority=20
autorestart=true
startretries=20

[program:vnc-control]
command=/usr/bin/x11vnc -display :1 -forever -shared -localhost -rfbport 5900 -nopw -quiet
priority=30
autorestart=true
startretries=20

[program:vnc-view]
command=/usr/bin/x11vnc -display :1 -forever -shared -viewonly -localhost -rfbport 5901 -nopw -quiet
priority=30
autorestart=true
startretries=20
