[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1280x800x24 -nolisten tcp
user=witden
priority=10
autorestart=true
startretries=20

[program:fluxbox]
command=/bin/sh /home/witden/.fluxbox/startup
user=witden
environment=DISPLAY=":1",HOME="/home/witden"
priority=20
autorestart=true
startretries=20

[program:vnc-control]
command=/usr/bin/x11vnc -display :1 -forever -shared -localhost -rfbport 5900 -nopw -quiet
user=witden
priority=30
autorestart=true
startretries=20

[program:vnc-view]
command=/usr/bin/x11vnc -display :1 -forever -shared -viewonly -localhost -rfbport 5901 -nopw -quiet
user=witden
priority=30
autorestart=true
startretries=20
